<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenFront | Gabriel's Arcade</title>
    <meta
      name="description"
      content="Play OpenFront with friends. Create a lobby and share its arcade link."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage">
      <section id="notice" aria-live="polite">
        <p id="message">Connecting to the community game server…</p>
        <button id="retry">Try again</button>
      </section>
      <iframe
        id="game"
        title="OpenFront multiplayer game"
        allow="fullscreen; clipboard-write; autoplay"
        allowfullscreen
        hidden
      ></iframe>
    </main>
    <footer>© OpenFront and Contributors</footer>
    <script type="module" src="./app.js?v=auto-connect"></script>
  </body>
</html>
